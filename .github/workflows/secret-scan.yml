name: Secret scan

# Catches a committed API key or webhook secret before it's mergeable. Needs
# no repo secrets beyond GITHUB_TOKEN, which every workflow gets automatically
# — nothing to configure.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
